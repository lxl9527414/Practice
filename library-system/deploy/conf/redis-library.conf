bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
pidfile /opt/library/redis/data/redis-library.pid
loglevel notice
logfile ""
dir /opt/library/redis/data
databases 16
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
dbfilename dump.rdb
appendonly yes
appendfilename appendonly.aof
appendfsync everysec
requirepass __REDIS_PASSWORD__
maxmemory 128mb
maxmemory-policy allkeys-lru
